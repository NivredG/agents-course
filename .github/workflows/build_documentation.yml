name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@6f0962e04218e46b8117ac5990789cccebb647d8  # main
    with:
      commit_sha: ${{ github.sha }}
      package: agents-course
      package_name: agents-course
      path_to_docs: agents-course/units/
      additional_args: --not_python_module
      languages: en zh-CN ru-RU vi es ko fr
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
