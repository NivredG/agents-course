name: Build PR Documentation

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_pr_documentation.yml@1b16dac5e33043af565fdf4c1b5b0fe81d0891c8  # main
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.number }}
      package: agents-course
      package_name: agents-course
      path_to_docs: agents-course/units/
      additional_args: --not_python_module
      languages: en zh-CN ru-RU vi es ko fr
